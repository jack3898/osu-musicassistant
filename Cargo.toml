[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/jack3898/osu-musicassistant"

[workspace.dependencies]
realm-sys = { path = "crates/realm-sys" }
lazer-library = { path = "crates/lazer-library" }
subsonic-server = { path = "crates/subsonic-server" }
ma-client = { path = "crates/ma-client" }
